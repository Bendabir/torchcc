# See https://prek.j178.dev for more information
fail_fast: true
default_language_version:
  python: python3.11

default_install_hook_types:
  - pre-commit
  - post-checkout
  - post-merge
  - post-rewrite

repos:
  - repo: builtin
    hooks:
      - id: check-added-large-files
        priority: 0
      - id: check-toml
        priority: 0
      - id: check-yaml
        args:
          - --allow-multiple-documents
        priority: 0
      - id: check-json5
        priority: 0
      - id: check-merge-conflict
        priority: 0
      - id: check-symlinks
        priority: 0
      - id: destroyed-symlinks
        priority: 0
      - id: check-executables-have-shebangs
        priority: 0
      - id: check-shebang-scripts-are-executable
        priority: 0
      - id: detect-private-key
        priority: 0
      - id: end-of-file-fixer
        priority: 0
      - id: trailing-whitespace
        priority: 0
  # Hooks without builtin support
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: name-tests-test
        priority: 0
  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run --only-group dev black
        args: ["--check"]
        language: system
        types_or: [python, pyi]
        require_serial: true
        priority: 0
      - id: ruff
        name: ruff
        entry: uv run --only-group dev ruff check
        args: ["--force-exclude"]
        language: system
        types_or: [python, pyi]
        require_serial: true
        priority: 0
      - id: mypy
        name: mypy
        entry: uv run --no-install-project mypy
        args: ["--ignore-missing-imports", "--scripts-are-modules"]
        language: system
        types_or: [python, pyi]
        require_serial: true
        priority: 0
      - id: uv-lock
        name: uv-lock
        entry: uv lock
        args: [--check]
        language: system
        pass_filenames: false
        files: "(pyproject.toml|uv.lock)$"
        priority: 0
      # Keep the dev tools in sync with the branch. Skip the project (CUDA build).
      - id: uv-sync
        name: uv-sync
        entry: uv sync
        args: [--frozen, --no-install-project]
        language: system
        stages: [post-checkout, post-merge, post-rewrite]
        always_run: true
        pass_filenames: false
        priority: 0
      - id: nixfmt
        name: nixfmt
        entry: nixfmt --check
        language: system
        types: [nix]
        priority: 0
      - id: deadnix
        name: deadnix
        entry: deadnix --fail
        language: system
        types: [nix]
        priority: 0
      - id: statix
        name: statix
        entry: statix check
        language: system
        types: [nix]
        pass_filenames: false
        priority: 0
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        alias: prettier-check
        name: prettier (JSON, Markdown & YAML)
        entry: prettier --check --ignore-unknown
        files: "\\.(json|md|yaml|yml)$"
        priority: 0
