name: Release
on:
  push:
    tags:
      - "*.*.*"
jobs:
  build:
    name: build (${{ matrix.cuda-version }}, python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        # One line per build, like PyTorch. Follows the README compatibility matrix.
        # The CUDA group and the Nix shell are defined in pyproject.toml and flake.nix.
        # The locked Torch of each group sets the Python range.
        # Python 3.10 has been dropped because it reached EoL.
        include:
          # CUDA 12.6 (3.10 to 3.15)
          - { cuda-version: cu126, python-version: "3.11" }
          - { cuda-version: cu126, python-version: "3.12" }
          - { cuda-version: cu126, python-version: "3.13" }
          - { cuda-version: cu126, python-version: "3.14" }
          - { cuda-version: cu126, python-version: "3.15" }
          # CUDA 12.8 (3.10 to 3.14)
          - { cuda-version: cu128, python-version: "3.11" }
          - { cuda-version: cu128, python-version: "3.12" }
          - { cuda-version: cu128, python-version: "3.13" }
          - { cuda-version: cu128, python-version: "3.14" }
          # CUDA 13.0 (3.10 to 3.15)
          - { cuda-version: cu130, python-version: "3.11" }
          - { cuda-version: cu130, python-version: "3.12" }
          - { cuda-version: cu130, python-version: "3.13" }
          - { cuda-version: cu130, python-version: "3.14" }
          - { cuda-version: cu130, python-version: "3.15" }
          # CUDA 13.2 (3.10 to 3.15)
          - { cuda-version: cu132, python-version: "3.11" }
          - { cuda-version: cu132, python-version: "3.12" }
          - { cuda-version: cu132, python-version: "3.13" }
          - { cuda-version: cu132, python-version: "3.14" }
          - { cuda-version: cu132, python-version: "3.15" }
          # CUDA 13.4 (3.11 to 3.15)
          - { cuda-version: cu134, python-version: "3.11" }
          - { cuda-version: cu134, python-version: "3.12" }
          - { cuda-version: cu134, python-version: "3.13" }
          - { cuda-version: cu134, python-version: "3.14" }
          - { cuda-version: cu134, python-version: "3.15" }
    steps:
      - name: sync-code
        uses: actions/checkout@v7
      # The runner ships ~25 GB of tooling the build does not need. Removing it leaves room for the CUDA toolkit.
      - name: free-disk-space
        run: |
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/boost \
            /usr/share/swift \
            /opt/hostedtoolcache \
            "${AGENT_TOOLSDIRECTORY:-}"
          sudo docker image prune --all --force || true
          df -h /
      # Nix only provides the CUDA toolkit. Python, PyTorch and NVIDIA libs come from PyPI.
      - name: setup-nix
        uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31.11.4
      - name: install-deps
        run: >
          nix develop .#${{ matrix.cuda-version }} -c
          uv sync --locked --python ${{ matrix.python-version }}
          --no-default-groups --group build --group ${{ matrix.cuda-version }}
          --no-install-project
      - name: build
        run: >
          nix develop .#${{ matrix.cuda-version }} -c
          uv build --wheel --no-build-isolation --no-config --python .venv/bin/python
      # The Nix compiler sets an RPATH to the Nix store (glibc, libstdc++, CUDA).
      # PyTorch is loaded by Python first, so the extension does not need it.
      - name: strip-rpath
        run: |
          mkdir unpacked
          unzip -q dist/*.whl -d unpacked
          so=$(find unpacked -name "_cuda*.so")
          nix develop .#${{ matrix.cuda-version }} -c patchelf --remove-rpath "$so"
          rm dist/*.whl
          # Repack so that RECORD matches the patched file
          nix develop .#${{ matrix.cuda-version }} -c uvx --from wheel wheel pack unpacked --dest-dir dist
      # The extension must not depend on anything from the Nix store
      - name: check
        shell: bash
        run: |
          so=$(find unpacked -name "_cuda*.so")
          readelf -d "$so"
          if readelf -d "$so" | grep -q /nix/store; then
            echo "The extension refers to the Nix store." >&2
            exit 1
          fi
          echo "Max. glibc symbol : $(objdump -T "$so" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1)"
          echo "Max. GLIBCXX symbol : $(objdump -T "$so" | grep -o 'GLIBCXX_[0-9.]*' | sort -uV | tail -n 1)"
      # The wheel name already carries the CUDA tag (local version set in setup.py)
      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.cuda-version }}-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 1
  release:
    name: release
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      contents: write
      id-token: write # Sigstore keyless signing
      attestations: write
    steps:
      # Sync code to get the changelog. The release notes are the section of the tag version.
      - name: sync-code
        uses: actions/checkout@v7
      - name: download
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: "*.whl"
          merge-multiple: true # Send all artifacts to the same directory
      # Signed with Sigstore. Verify with : gh attestation verify <wheel> --repo bendabir/torchcc
      - name: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.whl
      - name: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          awk -v v="$GITHUB_REF_NAME" '
            /^## \[/ { p = index($0, "[" v "]") }
            /^\[[^]]+\]: / { p = 0 }
            p
          ' CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$GITHUB_REF_NAME" -F notes.md -t "TorchCC $GITHUB_REF_NAME" dist/*.whl
