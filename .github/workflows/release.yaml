name: Release
on:
  push:
    tags:
      - "*.*.*"
jobs:
  build:
    name: build (${{ matrix.cuda }}, python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        cuda:
          # One build per CUDA version, like PyTorch.
          # The group and the Nix shell are defined in pyproject.toml and flake.nix.
          [cu126, cu128, cu130, cu132, cu134]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: sync-code
        uses: actions/checkout@v4
      # Nix only provides the CUDA toolkit. Python, PyTorch and NVIDIA libs come from PyPI.
      - name: setup-nix
        uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31.11.4
      - name: install-deps
        run: >
          nix develop .#${{ matrix.cuda }}-ci -c
          uv sync --locked --python ${{ matrix.python-version }}
          --no-default-groups --group build --group ${{ matrix.cuda }}
          --no-install-project
      - name: build
        run: >
          nix develop .#${{ matrix.cuda }}-ci -c
          uv build --wheel --no-build-isolation --python .venv/bin/python
      # The extension must not depend on anything from the Nix store
      - name: check
        shell: bash
        run: |
          mkdir unpacked
          unzip -q dist/*.whl -d unpacked
          so=$(find unpacked -name "_C*.so")
          readelf -d "$so"
          if readelf -d "$so" | grep -q /nix/store; then
            echo "The extension refers to the Nix store." >&2
            exit 1
          fi
          echo "Max. glibc symbol : $(objdump -T "$so" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1)"
      - name: rename
        id: rename
        env:
          CUDA_TAG: ${{ matrix.cuda }}
        run: |
          cd dist

          WHEEL_NAME=$(ls)
          NEW_WHEEL_NAME=$(echo $WHEEL_NAME | sed "s/\(torchcc-[^-]*\)/\1+${CUDA_TAG}/g")

          mv $WHEEL_NAME $NEW_WHEEL_NAME
          echo "wheel-name=${NEW_WHEEL_NAME}" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rename.outputs.wheel-name }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 1
  release:
    name: release
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      contents: write
    steps:
      # Sync code to get the changelog, we could go for auto-generation
      # We will inject the full changelog every time, not for the best...
      - name: sync-code
        uses: actions/checkout@v4
      - name: download
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "*.whl"
          merge-multiple: true # Send all artifacts to the same directory
      - name: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ github.ref_name }} -F CHANGELOG.md -t "TorchCC ${{ github.ref_name }}" dist/*.whl
