# --- project ---
[project]
name = "torchcc"
version = "0.1.0"
description = "Efficient Connected Components Labeling for PyTorch."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Bendabir" }]
keywords = ["torch"]
requires-python = ">=3.11,<4"
dependencies = ["torch>=2.10,<3"]

[project.urls]
Homepage = "https://github.com/bendabir/torchcc"
Repository = "https://github.com/bendabir/torchcc"
Documentation = "https://github.com/Bendabir/torchcc/README.md"

[project.optional-dependencies]
opencv = ["opencv-python>=4.0,<5"]
opencv-headless = ["opencv-python-headless>=4.0,<5"] # TODO : Update ?
cc3d = ["connected-components-3d>=3.0,<4"]           # TODO : Update ?

[dependency-groups]
dev = [
    "prek>=0.5,<1",
    "ty>=0.0,<0.1",
    "ruff>=0.15,<1",
    "pytest>=9.0,<10",
    "pytest-cov>=7.0,<8",
    "pytest-randomly>=5.0,<6",
    "opencv-python-headless>=4.0,<5",
    "connected-components-3d>=3.0,<4",
]
# Needed to build the extension without build isolation (CI)
build = ["setuptools>=77", "ninja>=1.0,<2"]
# One group per CUDA version to build against (and test locally). They are not published.
cu126 = ["torch>=2.10,<2.15", "nvidia-cuda-runtime-cu12==12.6.*"]
cu128 = ["torch>=2.10,<2.12", "nvidia-cuda-runtime-cu12==12.8.*"]
cu130 = ["torch>=2.10,<2.15", "nvidia-cuda-runtime==13.0.*"]
cu132 = ["torch>=2.12,<3", "nvidia-cuda-runtime==13.2.*"]
cu134 = ["torch>=2.15,<3", "nvidia-cuda-runtime==13.4.*"]

[build-system]
requires = ["setuptools>=77", "ninja>=1.0,<2", "torch>=2.10,<3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
torchcc = ["py.typed", "_C.pyi"]

# --- uv ---
[tool.uv]
# Ignore packages published in the last 3 days (supply chain safety)
exclude-newer = "3 days"
conflicts = [
    [
        { group = "cu126" },
        { group = "cu128" },
        { group = "cu130" },
        { group = "cu132" },
        { group = "cu134" },
    ],
]

# Build the extension with the same PyTorch version as the one installed in the env
[tool.uv.extra-build-dependencies]
torchcc = [{ requirement = "torch", match-runtime = true }]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", group = "cu126" },
    { index = "pytorch-cu128", group = "cu128" },
    { index = "pytorch-cu130", group = "cu130" },
    { index = "pytorch-cu132", group = "cu132" },
    { index = "pytorch-cu134", group = "cu134" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu134"
url = "https://download.pytorch.org/whl/cu134"
explicit = true

# --- ty ---
[tool.ty.environment]
python-version = "3.11"
root = ["src", "tests"]

[tool.ty.src]
include = ["src", "tests"]

# --- ruff ---
[tool.ruff]
line-length = 88
target-version = "py311"
indent-width = 4
preview = true
namespace-packages = ["src/torchcc"]
include = ["src/**/*.py", "tests/**/*.py", "pyproject.toml", "setup.py"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
task-tags = ["TODO", "FIXME", "NOTE"]
select = ["ALL"]
ignore = [
    "any-type",
    "dot-format-in-exception",
    "f-string-in-exception",
    "invalid-todo-tag",
    "missing-todo-author",
    "missing-todo-link",
    "missing-trailing-comma",
    "raise-vanilla-args",
    "raw-string-in-exception",
    "undocumented-magic-method",
    "undocumented-public-module",
    "undocumented-public-package",
]
unfixable = ["commented-out-code"]

[tool.ruff.lint.per-file-ignores]
"src/**/*.pyi" = ["missing-copyright-notice"]
"tests/**/*.py" = [
    "assert",
    "boolean-type-hint-positional-argument",
    "magic-value-comparison",
    "missing-copyright-notice",
    "no-self-use",
    "private-member-access",
    "suspicious-non-cryptographic-random-usage",
    "undocumented-public-class",
    "undocumented-public-function",
    "undocumented-public-method",
]

[tool.ruff.lint.isort]
combine-as-imports = true
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pylint]
max-args = 12
max-branches = 20
max-returns = 12
max-statements = 100

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true
suppress-none-returning = true
suppress-dummy-args = true
allow-star-arg-any = true

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

# --- pytest ---
[tool.pytest.ini_options]
addopts = ["--strict-markers", "--import-mode=importlib"]
filterwarnings = ["error::"]
testpaths = ["tests"]

# --- coverage ---
[tool.coverage.run]
omit = ["tests/*"]
branch = true
disable_warnings = ["no-data-collected"]

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "if self\\.debug",
    "raise AssertionError",
    "raise NotImplementedError",
    "return NotImplemented",
    "if 0:",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
    "case never:",
    "assert_never(.+)",
    "if TYPE_CHECKING:",
]
show_missing = true # Show missing statements lines
skip_covered = true # Don't show files that are 100% covered
skip_empty = true # Don't show files with no executable code

[tool.coverage.json]
pretty_print = true
